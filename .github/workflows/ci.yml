name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      # Linux builds on the oldest supported Ubuntu, so its binary runs on any
      # distribution with glibc 2.35 or newer.
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Some tests open a window; Linux runners have no display without xvfb.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          $run ctest --test-dir build -C Release --output-on-failure

      # The host as a user runs it: one-shot commands against a fixture.
      - name: Smoke test
        shell: bash
        run: |
          host=$(find build \( -name clap-host -o -name clap-host.exe \) -type f -perm -u+x -not -path '*/CMakeFiles/*' -print -quit)
          plugin=$(find build/fixtures -name instrument.clap -print -quit)
          test -n "$host"
          test -n "$plugin"
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          $run "$host" --strict --json --quiet "$plugin" -- "profile 1"
          $run "$host" --strict --json --quiet "$plugin" -- "validate.run --isolate"

      # One file per platform: a tar keeps the executable bit and the app
      # bundle's layout, which the artifact's own zip would drop. The Mac app
      # must not load anything from Homebrew or /usr/local that a user lacks.
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              ! otool -L build/clap-host.app/Contents/MacOS/clap-host | grep -E '/usr/local/|/opt/homebrew/'
              tar -czf dist/clap-host-macOS.tar.gz -C build clap-host.app ;;
            Linux) tar -czf dist/clap-host-Linux.tar.gz -C build clap-host ;;
            Windows) cp build/Release/clap-host.exe dist/ ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: clap-host-${{ runner.os }}
          path: dist/*

  # A tag vX.Y.Z publishes the three builds as a GitHub release. The tag must
  # match project()'s VERSION, which is what the host reports.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^project(.* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but CMakeLists.txt says $version"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "clap-host $GITHUB_REF_NAME" --generate-notes
